# สร้างไฟล์ APK สำหรับ Google TV ให้ดาวน์โหลดได้ โดยไม่ต้องลง Android Studio เอง
#
# ใช้เมื่อ: แก้ที่อยู่ของสไลด์โชว์ใน tv/app/src/main/res/values/strings.xml แล้ว
# อยากได้ APK ตัวใหม่ → ไปที่แท็บ Actions บน GitHub แล้วกด Run workflow
# เสร็จแล้วโหลด artifact ชื่อ wedding-slideshow-tv
name: Build TV APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'tv/**'
      - '.github/workflows/tv-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner ของ GitHub มี Android SDK ติดมาให้อยู่แล้ว ไม่ต้องโหลดเอง
      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: tv
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wedding-slideshow-tv
          path: tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
