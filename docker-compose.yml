# ตั้งชื่อ project ให้แน่นอน จะได้ขึ้นเป็น "wedding-share" ใน Container Manager
# ไม่ว่าจะวางโค้ดไว้ในโฟลเดอร์ชื่ออะไร
name: wedding-share

services:
  wedding-share:
    container_name: wedding-share
    image: wedding-share:latest
    build:
      context: .
      # จำเป็นบน NAS ตัวนี้: docker0 bridge ออกอินเทอร์เน็ตไม่ได้ (iptables MASQUERADE เสีย)
      # ถ้าเอาบรรทัดนี้ออก `npm ci` จะล้มตอน build ด้วย ETIMEDOUT / ENOTFOUND
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Bangkok}
    # กฎข้อ (1) ของมาตรฐาน: embedded DNS ของ Docker บน NAS นี้ resolve
    # โดเมนภายนอกไม่ได้ (getaddrinfo EAI_AGAIN) แอปนี้ไม่ได้เรียกเน็ตออกตอนรัน
    # แต่ใส่ไว้ให้ตรงมาตรฐาน และกันไว้เผื่อเพิ่มฟีเจอร์ที่ต้องต่อออกภายหลัง
    dns:
      - 1.1.1.1
      - 192.168.2.2
    # ให้ตรงกับเจ้าของโฟลเดอร์บน DSM ไม่งั้นเขียนไฟล์ไม่ได้ (หาเลขด้วย `id`)
    user: "${PUID:-1026}:${PGID:-100}"
    ports:
      # ค่าเริ่มต้นผูกกับ loopback เท่านั้น — เข้าถึงได้เฉพาะ reverse proxy บน NAS
      # ตั้ง BIND_ADDR=0.0.0.0 ชั่วคราวเพื่อทดสอบจากมือถือใน LAN ก่อนตั้ง reverse proxy
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-18090}:3000"
    volumes:
      # ── ข้อมูลจริง: bind mount ไปโฟลเดอร์บน DSM ─────────────────────────
      # เปิดดูผ่าน File Station / SMB ได้ ให้ Synology Photos ไล่ index ได้
      # และ Clean + Build ใน Container Manager ไม่แตะต้องไฟล์เหล่านี้
      #
      # ⚠ ต้อง mount โฟลเดอร์แม่ครั้งเดียว ห้ามแยกเป็น uploads/derived/db/tmp
      # สี่บรรทัด แม้จะอยู่บนวอลุ่มเดียวกันก็ตาม เพราะ Docker นับแต่ละ bind mount
      # เป็นคนละ mount point ทำให้ rename() ข้ามกันไม่ได้ (EXDEV) โค้ดจึงต้อง
      # ตกไปใช้วิธี copy ทั้งไฟล์ = อ่าน+เขียนวิดีโอทั้งก้อนซ้ำอีกรอบทุกครั้ง
      # ที่แขกอัพโหลด mount รวมแบบนี้ rename() ทำงานได้ ย้ายไฟล์จบในพริบตา
      - /volume1/wedding:/app/data
      # ── โค้ด: bind mount แบบอ่านอย่างเดียว ──────────────────────────────
      # แก้โค้ดแล้ว Restart พอ ไม่ต้อง rebuild image (node_modules อยู่ใน image)
      - ./src:/app/src:ro
      - ./views:/app/views:ro
      - ./public:/app/public:ro
      - ./locales:/app/locales:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # กันไม่ให้การแปลงวิดีโอกิน NAS ทั้งเครื่องตอนแขกอัพโหลดพร้อมกัน
    #
    # ใช้ cpu_shares (น้ำหนักความสำคัญ) ไม่ใช่ cpus (โควตาแบบตายตัว) เพราะ
    # kernel ของ DSM ไม่รองรับ CFS quota — ถ้าใส่ cpus จะขึ้น
    # "NanoCPUs can not be set, as your kernel does not support CPU CFS scheduler"
    # แล้วคอนเทนเนอร์สร้างไม่ขึ้นเลย
    #
    # ตัวคุมภาระ CPU จริง ๆ คือ FFMPEG_THREADS ใน .env
    cpu_shares: 512
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
