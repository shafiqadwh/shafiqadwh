<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Booth</title>
  <link rel="stylesheet" href="booth.css">
  <link rel="stylesheet" href="studio.css">
</head>
<body class="studio-guest">
  <header class="studio-header">
    <span class="studio-brand">PHOTO BOOTH</span>
    <nav class="studio-progress" aria-label="ขั้นตอนถ่ายภาพ"><span><b>1</b> ถ่ายภาพ</span><span><b>2</b> เลือกรูป</span><span><b>3</b> รับรูป</span></nav>
  </header>
  <!--
    หน้าจอเดียว สี่สถานะ สลับกันด้วย data-stage บน <body>
    แขกยืนอยู่หน้าบูธ ทุกอย่างต้องอ่านออกจากระยะสองเมตรและกดด้วยนิ้วโป้งได้
  -->
  <main class="booth">
    <!-- 1. พร้อมเริ่ม -->
    <section class="stage stage--ready" data-stage-panel="ready">
      <span class="eyebrow">พร้อมเก็บช่วงเวลาดี ๆ</span>
      <h1 class="event" id="event-title"></h1>
      <p class="event__sub" id="event-subtitle"></p>

      <div class="effects" id="effects" role="radiogroup" aria-label="เลือกโทนภาพ"></div>

      <button class="big" id="start" type="button">
        <span id="start-label">เริ่มถ่าย</span>
        <small id="shot-count"></small>
      </button>
    </section>

    <!-- 2. กำลังถ่าย -->
    <section class="stage stage--shoot" data-stage-panel="shoot">
      <div class="viewfinder">
        <video id="preview" autoplay playsinline muted></video>
        <div class="count" id="count" aria-live="assertive"></div>
        <div class="flash" id="flash" aria-hidden="true"></div>
      </div>
      <p class="progress" id="progress"></p>
    </section>

    <!-- 3. ดูแผ่นที่ได้ -->
    <section class="stage stage--review" data-stage-panel="review">
      <img class="sheet" id="sheet" alt="แผ่นที่ประกอบแล้ว">
      <div class="row">
        <button class="big" id="deliver" type="button">พิมพ์</button>
        <button class="big big--ghost" id="again" type="button">ถ่ายใหม่</button>
      </div>
      <p class="token" id="token"></p>
    </section>

    <!-- 3.5 จ่ายเงิน (เฉพาะบูธที่ตั้งขายไว้) -->
    <section class="stage stage--pay" data-stage-panel="pay">
      <p class="pay__price" id="pay-price"></p>
      <!-- QR ใหญ่เต็มที่ · แขกยกมือถือขึ้นสแกนจากระยะยืน ไม่ได้ก้มลงมาจ่อ -->
      <img class="pay__qr" id="pay-qr" alt="QR พร้อมเพย์สำหรับชำระเงิน">
      <p class="pay__hint">สแกนด้วยแอปธนาคารเพื่อชำระเงิน</p>
      <!--
        ปุ่มยืนยันขึ้นเฉพาะบูธที่ไม่มีจอช่างภาพ (บูธจอเดียว)
        มีจอช่างภาพเมื่อไร ปุ่มนี้หายไป แล้วคนกดยืนยันคือคนที่เห็นแอปธนาคารเท่านั้น
      -->
      <div class="row" id="pay-buttons" hidden>
        <button class="big big--ghost" id="pay-cancel" type="button">ยกเลิก</button>
        <button class="big" id="pay-done" type="button">จ่ายแล้ว</button>
      </div>
      <p class="pay__wait" id="pay-wait">รอเจ้าของบูธยืนยันการชำระเงิน</p>
    </section>

    <!-- 4. เสร็จแล้ว -->
    <section class="stage stage--done" data-stage-panel="done">
      <!-- QR ใหญ่พอสแกนจากระยะยืนหน้าบูธ · ไม่มี QR ก็ขึ้นเครื่องหมายถูกแทน -->
      <img class="done__qr" id="done-qr" alt="" hidden>
      <p class="done__mark" id="done-mark" aria-hidden="true">✓</p>
      <p class="done__text" id="done-text"></p>
      <p class="done__code" id="done-code"></p>
      <button class="big" id="restart" type="button">ถ่ายอีกครั้ง</button>
    </section>

    <p class="error" id="error" role="alert" hidden></p>
  </main>

  <script type="module" src="booth.js"></script>
</body>
</html>
