<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Photo Booth · จอช่างภาพ</title>
  <link rel="stylesheet" href="operator.css">
</head>
<body>
  <!--
    จอด้านหลัง — ช่างภาพเป็นคนดู ไม่ใช่แขก
    เห็นทุกอย่างที่จอหน้าเห็น (ส่งต่อมาทาง booth:message) แล้วสั่งงานกลับไปได้
    ปุ่มสองปุ่มตรงกับปุ่มสองปุ่มบนรีโมทเป๊ะ ๆ — ใครหยิบรีโมทมาก็เดาถูกทันที
  -->
  <header class="bar">
    <h1 class="bar__title" id="event-title"></h1>
    <p class="bar__stage" id="stage-label">กำลังเชื่อมต่อ…</p>
  </header>

  <main class="view">
    <img class="view__image" id="view-image" alt="" hidden>
    <p class="view__idle" id="view-idle">พร้อมถ่าย</p>
    <div class="view__count" id="count" aria-live="polite"></div>
  </main>

  <p class="progress" id="progress"></p>

  <!--
    แผงเก็บเงิน — ขึ้นเฉพาะขั้นจ่ายเงิน
    ยอดกับ QR ใบเดียวกับที่แขกเห็น เจ้าของบูธจะได้ตอบได้ว่าแขกกำลังดูอะไรอยู่
    ปุ่ม "ได้รับเงินแล้ว" อยู่ที่นี่ที่เดียวเมื่อมีจอนี้ — แขกยืนยันให้ตัวเองไม่ได้
  -->
  <section class="pay" id="pay" hidden>
    <img class="pay__qr" id="pay-qr" alt="">
    <div class="pay__side">
      <p class="pay__price" id="pay-price"></p>
      <p class="pay__note">ดูแอปธนาคารก่อนกดยืนยัน — โปรแกรมไม่รู้ว่าเงินเข้าหรือยัง</p>
      <button class="key key--ghost" id="pay-free" type="button">ไม่คิดเงิน</button>
    </div>
  </section>

  <div class="controls">
    <button class="key key--ghost" id="back" type="button" hidden>ถ่ายใหม่</button>
    <button class="key" id="go" type="button">เริ่มถ่าย</button>
  </div>

  <footer class="foot">
    <span class="foot__code" id="code"></span>
    <span class="foot__album" id="album"></span>
    <span class="foot__count" id="tally">วันนี้ 0 แผ่น</span>
    <!-- ยอดขายวันนี้ — คำถามเดียวที่เจ้าของถามตอนเก็บบูธ -->
    <span class="foot__takings" id="takings"></span>
    <!-- งานหลังงาน: ส่งรอบที่ยังค้างขึ้นเว็บ · ไม่มีปุ่มนี้ = QR บนกระดาษไม่มีวันมีรูป -->
    <button class="foot__send" id="send" type="button" disabled></button>
    <!--
      ตั้งค่า — เปิดได้เฉพาะตอนพร้อมถ่าย
      บันทึกค่าแล้วจอบูธโหลดใหม่ · กดกลางรอบถ่ายคือทิ้งรอบของแขกที่ยืนอยู่ตรงนั้น
    -->
    <button class="foot__setup" id="setup" type="button" title="ตั้งค่าบูธ">⚙︎</button>
  </footer>

  <script type="module" src="operator.js"></script>
</body>
</html>
